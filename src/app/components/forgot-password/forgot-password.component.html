<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="helper.modalController.dismiss()" expand="block" fill="clear" shape="round">
        Close
      </ion-button>
    </ion-buttons>
    <ion-title>Reset Password</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="bg-blue height-full">
    <ion-header class="blue-header" collapse="condense">
      <ion-toolbar class="blue-header">
        <ion-title color="light" size="large">
          <h3 class="cust-title">Reset Password</h3>
        </ion-title>
        <img class="h-40 p5" slot="end" [src]="resource.astriskIcon" alt="" />
      </ion-toolbar>
    </ion-header>

    <div class="account-form-container">
      <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="account-form">
        <div class="form-section">
          <ion-input label="Email Address" required labelPlacement="stacked" mode="md" fill="outline"
            formControlName="email" type="email"></ion-input>
          <app-validation-output type="error" [value]="formErrors()['email']"></app-validation-output>
          <br>
          <ion-button type="submit" expand="block" [disabled]="!resetForm.valid" class="submit-btn">
            @if (isLoading()) {
            <ion-spinner name="crescent"></ion-spinner>
            }@else {
            Send Reset Link
            }
          </ion-button>
        </div>


      </form>
    </div>
  </div>
</ion-content>
