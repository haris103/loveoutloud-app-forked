<ion-header mode="ios" class="ion-no-border">
  <ion-toolbar>
    <ion-title>{{data.title}}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="dismiss()">
        <ion-icon color="danger" slot="icon-only" name="close-circle-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<ion-content>
  <iframe [src]="sanitizedUrl()" frameborder="0" width="100%" height="100%"></iframe>
  
</ion-content>
<ion-footer>
  <ion-toolbar>
    <ion-button class="mh10" fill="solid" color="secondary" shape="round" expand="block" (click)="dismiss()">
      Close
    </ion-button>
  </ion-toolbar>
</ion-footer>
