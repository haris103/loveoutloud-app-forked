workflows:
  ios-app-store:
    name: Love Out Loud iOS App Store
    instance_type: mac_mini_m2
    max_build_duration: 120

    integrations:
      app_store_connect: "Connection API Key"

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.exofters.loveoutloud

      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.exofters.loveoutloud"

      node: 20
      xcode: latest
      cocoapods: default

    scripts:

      # ---------------------------------------------------------
      # 1. Install npm dependencies
      # ---------------------------------------------------------
      - name: Install npm dependencies
        script: |
          npm ci


      # ---------------------------------------------------------
      # 2. Build web assets
      # ---------------------------------------------------------
      - name: Build web assets
        script: |
          npm run build


      # ---------------------------------------------------------
      # 3. Add / sync Capacitor iOS
      # ---------------------------------------------------------
      - name: Add / sync Capacitor iOS
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

          npx cap sync ios


      # ---------------------------------------------------------
      # 4. Generate iOS app icon
      #
      # Using:
      # resources/icon-only.png
      #
      # Your original file is NOT renamed or modified.
      # ---------------------------------------------------------
      - name: Generate iOS app icon
        script: |
          echo "=========================================="
          echo "Preparing Love Out Loud iOS App Icon"
          echo "=========================================="

          if [ ! -f "resources/icon-only.png" ]; then
            echo "ERROR: resources/icon-only.png was not found!"
            exit 1
          fi

          echo ""
          echo "Using icon:"
          ls -lh resources/icon-only.png

          echo ""
          echo "Checking icon dimensions..."

          sips -g pixelWidth -g pixelHeight resources/icon-only.png

          WIDTH=$(sips -g pixelWidth resources/icon-only.png | tail -1 | awk '{print $2}')
          HEIGHT=$(sips -g pixelHeight resources/icon-only.png | tail -1 | awk '{print $2}')

          echo ""
          echo "Icon width:  $WIDTH"
          echo "Icon height: $HEIGHT"

          if [ "$WIDTH" -lt 1024 ] || [ "$HEIGHT" -lt 1024 ]; then
            echo ""
            echo "ERROR: resources/icon-only.png must be at least 1024x1024."
            echo "Current size: ${WIDTH}x${HEIGHT}"
            exit 1
          fi

          echo ""
          echo "Icon size is valid."


          # -----------------------------------------------------
          # Remove any previously generated AppIcon
          # -----------------------------------------------------

          echo ""
          echo "Removing old generated AppIcon files..."

          find ios \
            -type d \
            -name "AppIcon.appiconset" \
            -prune \
            -exec rm -rf {} +


          # -----------------------------------------------------
          # Capacitor Assets expects icon.png for the simple
          # icon-generation flow.
          #
          # We temporarily copy icon-only.png to icon.png.
          # The original icon-only.png is NOT changed.
          # -----------------------------------------------------

          echo ""
          echo "Creating temporary icon.png..."

          cp resources/icon-only.png resources/icon.png


          # -----------------------------------------------------
          # Generate iOS icons
          # -----------------------------------------------------

          echo ""
          echo "Generating iOS app icons..."

          npx @capacitor/assets generate \
            --ios \
            --assetPath resources


          # -----------------------------------------------------
          # Remove temporary file
          # -----------------------------------------------------

          echo ""
          echo "Removing temporary icon.png..."

          rm -f resources/icon.png

          echo ""
          echo "iOS app icon generation completed."


      # ---------------------------------------------------------
      # 5. Verify generated iOS AppIcon
      # ---------------------------------------------------------
      - name: Verify iOS app icon
        script: |
          echo "=========================================="
          echo "Checking generated iOS AppIcon"
          echo "=========================================="

          APP_ICON_PATH=$(find ios -type d -name "AppIcon.appiconset" -print -quit)

          if [ -n "$APP_ICON_PATH" ]; then

            echo ""
            echo "SUCCESS!"
            echo "AppIcon.appiconset found at:"
            echo "$APP_ICON_PATH"

            echo ""
            echo "Contents:"
            echo "------------------------------------------"

            ls -lah "$APP_ICON_PATH"

            echo ""
            echo "Checking Contents.json..."

            if [ -f "$APP_ICON_PATH/Contents.json" ]; then
              echo "SUCCESS: Contents.json exists."
            else
              echo "ERROR: Contents.json is missing."
              exit 1
            fi

            echo ""
            echo "Checking generated icon images..."

            IMAGE_COUNT=$(find "$APP_ICON_PATH" -type f \( \
              -name "*.png" \
              -o -name "*.jpg" \
              -o -name "*.jpeg" \
              \) | wc -l)

            echo "Generated icon image count: $IMAGE_COUNT"

            if [ "$IMAGE_COUNT" -gt 0 ]; then
              echo "SUCCESS: iOS icon images were generated."
            else
              echo "ERROR: No icon images were generated."
              exit 1
            fi

          else

            echo ""
            echo "ERROR: AppIcon.appiconset was NOT found."
            echo ""
            echo "Searching for Assets.xcassets..."
            find ios -type d -name "Assets.xcassets" -print

            echo ""
            echo "Searching for AppIcon files..."
            find ios -iname "*AppIcon*" -print

            exit 1

          fi


      # ---------------------------------------------------------
      # 6. Install CocoaPods
      # ---------------------------------------------------------
      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install


      # ---------------------------------------------------------
      # 7. Set up code signing
      # ---------------------------------------------------------
      - name: Set up code signing
        script: |
          xcode-project use-profiles


      # ---------------------------------------------------------
      # 8. Set iOS version
      # ---------------------------------------------------------
      - name: Set iOS version
        script: |
          cd ios/App

          agvtool new-marketing-version "2.4.2"

          echo "iOS marketing version set to 2.4.2"


      # ---------------------------------------------------------
      # 9. Set iOS build number
      # ---------------------------------------------------------
      - name: Set iOS build number
        script: |
          cd ios/App

          agvtool new-version -all "4"

          echo "iOS build number set to 4"


      # ---------------------------------------------------------
      # 10. Build IPA
      # ---------------------------------------------------------
      - name: Build IPA
        script: |
          echo "=========================================="
          echo "Building Love Out Loud IPA"
          echo "=========================================="

          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"


    # -----------------------------------------------------------
    # Artifacts
    # -----------------------------------------------------------
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log


    # -----------------------------------------------------------
    # App Store Connect / TestFlight
    # -----------------------------------------------------------
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true


    # -----------------------------------------------------------
    # Trigger
    # -----------------------------------------------------------
    triggering:
      events:
        - push

      branch_patterns:
        - pattern: dev
          include: true
          source: true
