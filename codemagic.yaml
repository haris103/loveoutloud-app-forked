workflows:
  ios-app-store:
    name: Love Out Loud iOS App Store
    instance_type: mac_mini_m2
    max_build_duration: 120

    integrations:
      app_store_connect: "Connection API Key"

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.exofters.loveoutloud

      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.exofters.loveoutloud"

      node: 20
      xcode: latest
      cocoapods: default

    scripts:

      - name: Install npm dependencies
        script: |
          npm ci

      - name: Build web assets
        script: |
          npm run build

      - name: Add / sync Capacitor iOS
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

          npx cap sync ios

      - name: Generate iOS App Icon
        script: |
          set -e

          echo "=========================================="
          echo "LOVE OUT LOUD - APP ICON GENERATION"
          echo "=========================================="

          SOURCE_ICON="resources/icon-only.png"
          OPAQUE_ICON="/tmp/love-out-loud-icon-opaque.png"
          ASSETS_DIR="ios/App/App/Assets.xcassets"
          APP_ICON_DIR="$ASSETS_DIR/AppIcon.appiconset"
          PYTHON_ENV="/tmp/love-out-loud-python"

          if [ ! -f "$SOURCE_ICON" ]; then
            echo "ERROR: $SOURCE_ICON was not found."
            exit 1
          fi

          echo "Source icon:"
          ls -lh "$SOURCE_ICON"

          echo ""
          echo "Source icon dimensions:"
          sips -g pixelWidth -g pixelHeight -g hasAlpha "$SOURCE_ICON"

          WIDTH=$(sips -g pixelWidth "$SOURCE_ICON" | tail -1 | awk '{print $2}')
          HEIGHT=$(sips -g pixelHeight "$SOURCE_ICON" | tail -1 | awk '{print $2}')

          echo ""
          echo "Width: $WIDTH"
          echo "Height: $HEIGHT"

          if [ "$WIDTH" -lt 1024 ] || [ "$HEIGHT" -lt 1024 ]; then
            echo "ERROR: icon-only.png must be at least 1024x1024."
            echo "Current size: ${WIDTH}x${HEIGHT}"
            exit 1
          fi

          if [ ! -d "$ASSETS_DIR" ]; then
            echo "ERROR: Assets.xcassets was not found."
            find ios -type d -name "Assets.xcassets" -print
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "Installing isolated image-processing tool"
          echo "=========================================="

          rm -rf "$PYTHON_ENV"

          python3 -m venv "$PYTHON_ENV"

          "$PYTHON_ENV/bin/python" -m pip install --upgrade pip

          "$PYTHON_ENV/bin/python" -m pip install "Pillow==11.3.0"

          echo ""
          echo "Pillow installation complete."

          echo ""
          echo "=========================================="
          echo "Creating fully opaque App Store icon"
          echo "=========================================="

          rm -f "$OPAQUE_ICON"

          "$PYTHON_ENV/bin/python" -c '
          from PIL import Image

          source = "resources/icon-only.png"
          output = "/tmp/love-out-loud-icon-opaque.png"

          img = Image.open(source).convert("RGBA")

          print("Original mode:", img.mode)
          print("Original size:", img.size)

          # Create a completely opaque white background.
          background = Image.new("RGB", img.size, (255, 255, 255))

          # Composite the original icon over the white background.
          background.paste(img, (0, 0), img)

          # Save as RGB PNG. RGB means there is NO alpha channel.
          background.save(
              output,
              format="PNG",
              optimize=True
          )

          print("Opaque icon created:", output)
          print("Final mode:", background.mode)
          print("Final size:", background.size)

          if background.mode != "RGB":
              raise SystemExit("ERROR: Output icon still has alpha.")

          if background.size != (1024, 1024):
              raise SystemExit("ERROR: Output icon is not 1024x1024.")

          print("SUCCESS: Icon is RGB and fully opaque.")
          '

          echo ""
          echo "Checking generated opaque icon..."

          sips -g pixelWidth -g pixelHeight -g hasAlpha "$OPAQUE_ICON"

          OPAQUE_ALPHA=$(sips -g hasAlpha "$OPAQUE_ICON" | tail -1 | awk '{print $2}')

          if [ "$OPAQUE_ALPHA" != "no" ]; then
            echo "ERROR: Generated icon still has an alpha channel."
            exit 1
          fi

          echo "SUCCESS: Generated icon has no alpha channel."

          echo ""
          echo "Removing existing AppIcon..."

          rm -rf "$APP_ICON_DIR"

          mkdir -p "$APP_ICON_DIR"

          echo ""
          echo "=========================================="
          echo "Generating iPhone icons"
          echo "=========================================="

          sips -z 40 40 "$OPAQUE_ICON" \
            --out "$APP_ICON_DIR/AppIcon-20@2x.png" >/dev/null

          sips -z 60 60 "$OPAQUE_ICON" \
            --out "$APP_ICON_DIR/AppIcon-20@3x.png" >/dev/null

          sips -z 58 58 "$OPAQUE_ICON" \
            --out "$APP_ICON_DIR/AppIcon-29@2x.png" >/dev/null

          sips -z 87 87 "$OPAQUE_ICON" \
            --out "$APP_ICON_DIR/AppIcon-29@3x.png" >/dev/null

          sips -z 80 80 "$OPAQUE_ICON" \
            --out "$APP_ICON_DIR/AppIcon-40@2x.png" >/dev/null

          sips -z 120 120 "$OPAQUE_ICON" \
            --out "$APP_ICON_DIR/AppIcon-40@3x.png" >/dev/null

          sips -z 120 120 "$OPAQUE_ICON" \
            --out "$APP_ICON_DIR/AppIcon-60@2x.png" >/dev/null

          sips -z 180 180 "$OPAQUE_ICON" \
            --out "$APP_ICON_DIR/AppIcon-60@3x.png" >/dev/null

          echo ""
          echo "=========================================="
          echo "Generating iPad icons"
          echo "=========================================="

          sips -z 20 20 "$OPAQUE_ICON" \
            --out "$APP_ICON_DIR/AppIcon-20.png" >/dev/null

          sips -z 40 40 "$OPAQUE_ICON" \
            --out "$APP_ICON_DIR/AppIcon-20@2x-ipad.png" >/dev/null

          sips -z 29 29 "$OPAQUE_ICON" \
            --out "$APP_ICON_DIR/AppIcon-29.png" >/dev/null

          sips -z 58 58 "$OPAQUE_ICON" \
            --out "$APP_ICON_DIR/AppIcon-29@2x-ipad.png" >/dev/null

          sips -z 40 40 "$OPAQUE_ICON" \
            --out "$APP_ICON_DIR/AppIcon-40.png" >/dev/null

          sips -z 80 80 "$OPAQUE_ICON" \
            --out "$APP_ICON_DIR/AppIcon-40@2x-ipad.png" >/dev/null

          sips -z 76 76 "$OPAQUE_ICON" \
            --out "$APP_ICON_DIR/AppIcon-76.png" >/dev/null

          sips -z 152 152 "$OPAQUE_ICON" \
            --out "$APP_ICON_DIR/AppIcon-76@2x.png" >/dev/null

          sips -z 167 167 "$OPAQUE_ICON" \
            --out "$APP_ICON_DIR/AppIcon-83.5@2x.png" >/dev/null

          echo ""
          echo "=========================================="
          echo "Generating App Store 1024x1024 icon"
          echo "=========================================="

          sips -z 1024 1024 "$OPAQUE_ICON" \
            --out "$APP_ICON_DIR/AppIcon-1024.png" >/dev/null

          echo ""
          echo "Checking App Store icon alpha..."

          FINAL_ALPHA=$(sips -g hasAlpha \
            "$APP_ICON_DIR/AppIcon-1024.png" \
            | tail -1 \
            | awk '{print $2}')

          echo "App Store icon alpha: $FINAL_ALPHA"

          if [ "$FINAL_ALPHA" != "no" ]; then
            echo "ERROR: App Store icon contains an alpha channel."
            exit 1
          fi

          echo "SUCCESS: App Store icon contains no alpha channel."

          echo ""
          echo "=========================================="
          echo "Creating Contents.json"
          echo "=========================================="

          python3 -c '
          import json
          from pathlib import Path

          images = [
              {
                  "filename": "AppIcon-20.png",
                  "idiom": "ipad",
                  "scale": "1x",
                  "size": "20x20"
              },
              {
                  "filename": "AppIcon-20@2x-ipad.png",
                  "idiom": "ipad",
                  "scale": "2x",
                  "size": "20x20"
              },
              {
                  "filename": "AppIcon-29.png",
                  "idiom": "ipad",
                  "scale": "1x",
                  "size": "29x29"
              },
              {
                  "filename": "AppIcon-29@2x-ipad.png",
                  "idiom": "ipad",
                  "scale": "2x",
                  "size": "29x29"
              },
              {
                  "filename": "AppIcon-40.png",
                  "idiom": "ipad",
                  "scale": "1x",
                  "size": "40x40"
              },
              {
                  "filename": "AppIcon-40@2x-ipad.png",
                  "idiom": "ipad",
                  "scale": "2x",
                  "size": "40x40"
              },
              {
                  "filename": "AppIcon-76.png",
                  "idiom": "ipad",
                  "scale": "1x",
                  "size": "76x76"
              },
              {
                  "filename": "AppIcon-76@2x.png",
                  "idiom": "ipad",
                  "scale": "2x",
                  "size": "76x76"
              },
              {
                  "filename": "AppIcon-83.5@2x.png",
                  "idiom": "ipad",
                  "scale": "2x",
                  "size": "83.5x83.5"
              },
              {
                  "filename": "AppIcon-20@2x.png",
                  "idiom": "iphone",
                  "scale": "2x",
                  "size": "20x20"
              },
              {
                  "filename": "AppIcon-20@3x.png",
                  "idiom": "iphone",
                  "scale": "3x",
                  "size": "20x20"
              },
              {
                  "filename": "AppIcon-29@2x.png",
                  "idiom": "iphone",
                  "scale": "2x",
                  "size": "29x29"
              },
              {
                  "filename": "AppIcon-29@3x.png",
                  "idiom": "iphone",
                  "scale": "3x",
                  "size": "29x29"
              },
              {
                  "filename": "AppIcon-40@2x.png",
                  "idiom": "iphone",
                  "scale": "2x",
                  "size": "40x40"
              },
              {
                  "filename": "AppIcon-40@3x.png",
                  "idiom": "iphone",
                  "scale": "3x",
                  "size": "40x40"
              },
              {
                  "filename": "AppIcon-60@2x.png",
                  "idiom": "iphone",
                  "scale": "2x",
                  "size": "60x60"
              },
              {
                  "filename": "AppIcon-60@3x.png",
                  "idiom": "iphone",
                  "scale": "3x",
                  "size": "60x60"
              },
              {
                  "filename": "AppIcon-1024.png",
                  "idiom": "ios-marketing",
                  "scale": "1x",
                  "size": "1024x1024"
              }
          ]

          data = {
              "images": images,
              "info": {
                  "author": "xcode",
                  "version": 1
              }
          }

          path = Path(
              "ios/App/App/Assets.xcassets/"
              "AppIcon.appiconset/Contents.json"
          )

          path.write_text(json.dumps(data, indent=2))

          print("Contents.json created successfully.")
          '

          echo ""
          echo "=========================================="
          echo "AppIcon generation completed"
          echo "=========================================="

          ls -lah "$APP_ICON_DIR"

      - name: Verify iOS app icon
        script: |
          set -e

          echo "=========================================="
          echo "FINAL APP ICON VERIFICATION"
          echo "=========================================="

          APP_ICON_PATH="ios/App/App/Assets.xcassets/AppIcon.appiconset"

          if [ ! -d "$APP_ICON_PATH" ]; then
            echo "ERROR: AppIcon.appiconset was NOT found."
            exit 1
          fi

          if [ ! -f "$APP_ICON_PATH/Contents.json" ]; then
            echo "ERROR: Contents.json is missing."
            exit 1
          fi

          if [ ! -f "$APP_ICON_PATH/AppIcon-1024.png" ]; then
            echo "ERROR: AppIcon-1024.png is missing."
            exit 1
          fi

          echo ""
          echo "AppIcon location:"
          echo "$APP_ICON_PATH"

          echo ""
          echo "1024x1024 icon properties:"

          sips \
            -g pixelWidth \
            -g pixelHeight \
            -g hasAlpha \
            -g format \
            "$APP_ICON_PATH/AppIcon-1024.png"

          FINAL_WIDTH=$(sips -g pixelWidth \
            "$APP_ICON_PATH/AppIcon-1024.png" \
            | tail -1 \
            | awk '{print $2}')

          FINAL_HEIGHT=$(sips -g pixelHeight \
            "$APP_ICON_PATH/AppIcon-1024.png" \
            | tail -1 \
            | awk '{print $2}')

          FINAL_ALPHA=$(sips -g hasAlpha \
            "$APP_ICON_PATH/AppIcon-1024.png" \
            | tail -1 \
            | awk '{print $2}')

          if [ "$FINAL_WIDTH" != "1024" ]; then
            echo "ERROR: App Store icon width is $FINAL_WIDTH."
            exit 1
          fi

          if [ "$FINAL_HEIGHT" != "1024" ]; then
            echo "ERROR: App Store icon height is $FINAL_HEIGHT."
            exit 1
          fi

          if [ "$FINAL_ALPHA" != "no" ]; then
            echo "ERROR: App Store icon still has alpha."
            exit 1
          fi

          IMAGE_COUNT=$(find "$APP_ICON_PATH" -type f -name "*.png" | wc -l)

          echo ""
          echo "PNG count: $IMAGE_COUNT"

          if [ "$IMAGE_COUNT" -lt 10 ]; then
            echo "ERROR: Not enough icon images."
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "APP ICON VERIFICATION PASSED"
          echo "=========================================="
          echo ""
          echo "1024x1024: PASS"
          echo "No alpha:  PASS"
          echo "Icon files: PASS"

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Set iOS version
        script: |
          cd ios/App
          agvtool new-marketing-version "2.4.2"

      - name: Set iOS build number
        script: |
          cd ios/App
          agvtool new-version -all "5"
          echo "iOS build number set to 5"

      - name: Build IPA
        script: |
          echo "=========================================="
          echo "Building Love Out Loud IPA"
          echo "=========================================="

          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

    triggering:
      events:
        - push

      branch_patterns:
        - pattern: dev
          include: true
          source: true
